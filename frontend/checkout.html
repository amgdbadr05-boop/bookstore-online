<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Bookhaven</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><script src="js/api.js" defer></script><script src="js/checkout.js" defer></script></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">b.</span><span>BOOKHAVEN<small>THE READING ROOM</small></span></a><a href="cart.html">← Back to bag</a></div></header><main class="container section"><div class="eyebrow">Almost yours</div><h1 class="page-title">Checkout.</h1><div class="layout-two"><form id="checkout-form" class="panel"><h2>Delivery details</h2><div class="form-grid"><div class="form-group full"><label>Full name</label><input name="customer_name" required minlength="2" maxlength="120" autocomplete="name"></div><div class="form-group"><label>Email address</label><input type="email" name="customer_email" required maxlength="120" autocomplete="email"></div><div class="form-group"><label>Phone number</label><input name="customer_phone" required minlength="7" maxlength="20" autocomplete="tel"></div><div class="form-group full"><label>Shipping address</label><textarea name="shipping_address" required minlength="8" maxlength="2000" autocomplete="street-address"></textarea></div></div><div class="notice">Payment is not integrated in this university project. The order will be created with Pending status.</div><button type="submit" style="width:100%">Place order</button></form><aside class="panel"><h2>Your order</h2><div id="checkout-summary"></div></aside></div></main></body></html>
