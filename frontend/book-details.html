<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Details — Bookhaven</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><script src="js/api.js" defer></script><script defer>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id'),root=document.querySelector('#details');try{if(!id)throw Error('Book not specified.');const b=await API.get('/api/books/'+id);document.title=b.title+' — Bookhaven';root.innerHTML=`<div class="detail-cover"><img src="${escapeHTML(b.image_url||'')}" alt="${escapeHTML(b.title)}"></div><div class="detail-info"><div class="eyebrow">${escapeHTML(b.category_name)}</div><h1>${escapeHTML(b.title)}</h1><p>by ${escapeHTML(b.author)}</p><div class="detail-price">${money(b.price)}</div><p>${escapeHTML(b.description||'A thoughtful addition to your reading collection.')}</p><p><b>${b.stock>0?b.stock+' copies available':'Currently out of stock'}</b></p><div class="quantity"><label for="qty">Quantity</label><input id="qty" type="number" min="1" max="${Math.max(1,b.stock)}" value="1"></div><button id="add-detail" ${b.stock<1?'disabled':''}>Add to bag</button> <a class="btn btn-outline" href="catalog.html">Back to books</a></div>`;document.querySelector('#add-detail').onclick=()=>{const q=Math.max(1,Math.min(b.stock,Number(document.querySelector('#qty').value)||1));cartStore.add(b,q);toast('Added to your bag.')}}catch(e){root.innerHTML=`<div class="empty">${escapeHTML(e.message)}<p><a class="btn" href="catalog.html">Browse books</a></p></div>`}})</script></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">b.</span><span>BOOKHAVEN<small>THE READING ROOM</small></span></a><nav class="nav-links"><a href="index.html">Home</a><a href="catalog.html">Books</a><a href="track-order.html">Track order</a></nav><div class="nav-actions"><a class="cart-link" href="cart.html">Bag <span class="cart-count" data-cart-count>0</span></a><button class="menu-toggle">☰</button></div></div></header><main class="container section"><div class="layout-two" id="details"><p>Loading book details…</p></div></main><script src="js/api.js"></script></body></html>
