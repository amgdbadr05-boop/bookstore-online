<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — Bookhaven</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><script src="js/api.js" defer></script><script defer>document.addEventListener('DOMContentLoaded',()=>{const f=document.querySelector('#track-form');f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));try{const o=await API.post('/api/orders/track',d);document.querySelector('#track-result').innerHTML=`<div class="panel"><div class="summary-line"><b>Order #${o.order_id}</b><span class="status ${o.status}">${o.status}</span></div><p>${escapeHTML(o.customer_name)} · ${new Date(o.order_date).toLocaleString('id-ID')}</p>${o.items.map(x=>`<div class="summary-line"><span>${escapeHTML(x.title)} × ${x.quantity}</span><b>${money(x.subtotal)}</b></div>`).join('')}<div class="summary-line total"><span>Total</span><b>${money(o.total_amount)}</b></div></div>`}catch(err){document.querySelector('#track-result').innerHTML=`<div class="notice error">${escapeHTML(err.message)}</div>`}}})</script></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">b.</span><span>BOOKHAVEN<small>THE READING ROOM</small></span></a><a href="catalog.html">Browse books</a></div></header><main class="container section" style="max-width:700px"><div class="eyebrow">Order updates</div><h1 class="page-title">Track your order.</h1><p>Enter your order number and the email address or phone number used at checkout.</p><form id="track-form" class="panel"><div class="form-group"><label>Order ID</label><input type="number" name="order_id" min="1" required></div><div class="form-group" style="margin-top:14px"><label>Email or phone number</label><input name="contact" required></div><button style="margin-top:18px">Find my order</button></form><div id="track-result" style="margin-top:20px"></div></main></body></html>
