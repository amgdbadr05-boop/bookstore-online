<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Bookhaven</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><script src="../js/api.js" defer></script><script src="../js/admin.js" defer></script></head><body><main class="login-wrap"><form class="login-card" id="admin-login"><a class="brand" href="../index.html"><span class="brand-mark">b.</span><span>BOOKHAVEN<small>ADMINISTRATION</small></span></a><h1>Welcome back.</h1><p style="color:var(--muted)">Sign in to manage your bookstore.</p><div id="login-error" class="notice error" role="alert"></div><div class="form-group"><label>Username</label><input name="username" required autocomplete="username"></div><div class="form-group"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div><button type="submit">Sign in to dashboard</button><p style="font-size:12px;text-align:center"><a href="../index.html">← Return to bookstore</a></p></form></main><script>document.querySelector('#login-error').classList.add('hidden');document.querySelector('#admin-login').addEventListener('submit',()=>document.querySelector('#login-error').classList.remove('hidden'))</script></body></html>
